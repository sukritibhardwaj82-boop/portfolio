<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects | Open Sourcery</title>
    <meta name="description" content="Open Sourcery by Sci Mat: GitHub Pages and Actions demo.">
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>

<body>
    <!-- Black/white switch, top-right -->
    <div class="top-bar">
        <button class="icon-btn" id="theme-toggle" aria-label="Switch black and white">
            <svg id="icon-moon" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
                <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path>
            </svg>
            <svg id="icon-sun" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg" style="display:none;">
                <path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" fill-rule="evenodd" clip-rule="evenodd"></path>
            </svg>
        </button>
    </div>

    <!-- Hero -->
    <header class="short">
        <span class="badge">Page 02</span>
        <h1>Projects.</h1>
        <p class="tagline">Three empty slots. Put your work here.</p>

        <div class="btn-row">
            <a class="btn btn-outline" href="index.html">&larr; Home</a>
        </div>
    </header>

    <div class="container">

        <!-- Project slots: replace these with your own -->
        <section>
            <div class="box-grid">
                <div class="box reveal">
                    <span class="box-number">Project 01</span>
                    <h3>Your project here</h3>
                    <p>What it does, and a link to it.</p>
                </div>
                <div class="box reveal">
                    <span class="box-number">Project 02</span>
                    <h3>Your project here</h3>
                    <p>What it does, and a link to it.</p>
                </div>
                <div class="box reveal">
                    <span class="box-number">Project 03</span>
                    <h3>Your project here</h3>
                    <p>What it does, and a link to it.</p>
                </div>
            </div>
        </section>

    </div>

    <footer class="reveal">
        <p class="footer-label">Built at</p>
        <p class="footer-line">Open Sourcery<span class="dot">&bull;</span>Sci Mat<span class="dot">&bull;</span><span id="year">2026</span></p>
    </footer>
</body>

</html>
